name = "fund-bot"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Cloudflare D1 binding — replace with your real database ID after running:
# wrangler d1 create fund-db
[[d1_databases]]
binding = "DB"
database_name = "fund-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Non-secret config. Secrets go in wrangler secret put BOT_TOKEN.
ENVIRONMENT = "development"

# Uncomment to bind a secret for local dev:
# [secrets]
# BOT_TOKEN = "..."
